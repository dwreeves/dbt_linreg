name: "dbt_linreg_tests"
version: "0.3.2"

require-dbt-version: [">=1.0.0", "<2.0.0"]

config-version: 2

target-path: "target"
clean-targets: ["target", "dbt_modules", "dbt_packages"]
macro-paths: ["macros"]
log-path: "logs"

vars:
  _test_precision_simple_matrix: '{{ "10e-8" if target.name == "clickhouse" else 0.0 }}'
  _test_precision_collinear_matrix: '{{ "10e-6" if target.name == "clickhouse" else "10e-7" }}'

models:
  +materialized: table

seeds:
  # Fixes issue in Clickhouse to explicitly specify double
  # Float32 messes up rounding for integration tests
  +column_types:
    y: double precision
    x1: double precision
    x2: double precision
    x3: double precision
    x4: double precision
    x5: double precision
    xa: double precision
    xb: double precision
    xc: double precision
    xd: double precision
    xe: double precision
    xf: double precision
    xg: double precision
    xh: double precision
    xi: double precision
    xj: double precision

tests:
  +store_failures: true

# During dev only!
profile: "dbt_linreg_profile"
