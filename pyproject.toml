[project]
name = "dbt_linreg"
requires-python = ">=3.10,<3.14"
description = "dbt_linreg dbt package"
version = "0.3.3"
readme = "README.md"
authors = ["Daniel Reeves"]

[project.optional-dependencies]
clickhouse = [
    "dbt-core",
    "dbt-clickhouse",
]
duckdb = [
    "dbt-core",
    "dbt-duckdb",
    "duckdb>=1.1.3",
]
postgres = [
    "dbt-core",
    "dbt-postgres",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = true

[dependency-groups]
dev = [
    "prek>=0.5.2",
]
